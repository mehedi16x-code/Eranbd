<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eranbd - অ্যাড দেখে ইনকাম</title>
    <script src="https://telegram.org"></script>
    <!-- আপনার আসল Monetag SDK কোড -->
    <script src='//libtl.com/sdk.js' data-zone='12280121' data-sdk='show_12280121'></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { background: linear-gradient(135deg, #0088cc, #005580); padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        .header h2 { margin: 0; font-size: 24px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .bal { font-size: 32px; font-weight: bold; color: #00e676; margin: 5px 0; }
        .btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-purple { background: #6200ea; }
        .btn-green { background: #00c853; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 Eranbd</h2>
        <p id="uName">স্বাগতম!</p>
    </div>

    <div class="box">
        <div>আপনার বর্তমান ব্যালেন্স</div>
        <div class="bal">৳ <span id="bal">5.00</span></div>
        <div style="font-size: 13px; color: #aaa;">মোট দেখা অ্যাড: <span id="adCount">0</span> টি</div>
    </div>

    <div class="box">
        <h3>📺 বিজ্ঞাপন দেখে আয় করুন</h3>
        <button class="btn" id="ad1" onclick="watchRealAd(1, 1.00, 'default')">ভিডিও অ্যাড দেখুন (+৳১.০০)</button>
        <button class="btn btn-purple" id="ad2" onclick="watchRealAd(2, 0.50, 'pop')">পপআপ অ্যাড দেখুন (+৳০.৫০)</button>
    </div>

    <div class="box">
        <h3>💸 টাকা তুলুন (সর্বনিম্ন ৳৫০)</h3>
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="num" placeholder="বিকাশ বা নগদ নাম্বার">
        <input type="number" id="amt" placeholder="টাকার পরিমাণ">
        <button class="btn btn-green" onclick="withdraw()">টাকা তুলুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('uName').innerText = "স্বাগতম, " + tg.initDataUnsafe.user.first_name + "!";
        }

        let bal = parseFloat(localStorage.getItem('eb_bal')) || 5.00;
        let count = parseInt(localStorage.getItem('eb_count')) || 0;
        updateUI();

        function updateUI() {
            document.getElementById('bal').innerText = bal.toFixed(2);
            document.getElementById('adCount').innerText = count;
            localStorage.setItem('eb_bal', bal);
            localStorage.setItem('eb_count', count);
        }

        function watchRealAd(btnId, reward, adType) {
            let btn = document.getElementById('ad' + btnId);
            let oldText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            let adPromise = (adType === 'pop') ? show_12280121('pop') : show_12280121();

            adPromise.then(() => {
                bal += reward;
                count += 1;
                updateUI();
                btn.disabled = false;
                btn.innerText = oldText;
                alert("অভিনন্দন! বিজ্ঞাপন দেখার জন্য ৳" + reward.toFixed(2) + " যোগ হয়েছে।");
            }).catch((e) => {
                btn.disabled = false;
                btn.innerText = oldText;
                alert("এই মুহূর্তে বিজ্ঞাপন পাওয়া যায়নি, কয়েক সেকেন্ড পর আবার চেষ্টা করুন।");
            });
        }

        function withdraw() {
            let method = document.getElementById('method').value;
            let num = document.getElementById('num').value;
            let amt = parseFloat(document.getElementById('amt').value);

            if (num.length < 11 || isNaN(amt) || amt < 50 || amt > bal) {
                return alert("সঠিক ১১ ডিজিটের নাম্বার ও পর্যাপ্ত ব্যালেন্স দিন!");
            }
            bal -= amt;
            updateUI();
            alert(`সফল হয়েছে! ${method} (${num}) নাম্বারে ৳${amt} পাঠানোর রিকোয়েস্ট গ্রহণ করা হয়েছে।`);
        }
    </script>
</body>
</html>
