<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eranbd - অ্যাড দেখে ইনকাম</title>
    <script>
        var s1 = document.createElement('script');
        s1.src = "https://telegram" + ".org/js/telegram-web-app.js";
        document.head.appendChild(s1);

        var s2 = document.createElement('script');
        s2.src = "https://libtl" + ".com/sdk.js";
        s2.setAttribute("data-zone", "12280121");
        s2.setAttribute("data-sdk", "show_12280121");
        document.head.appendChild(s2);
    </script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { background: linear-gradient(135deg, #0088cc, #005580); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .header h2 { margin: 0; font-size: 24px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .bal { font-size: 32px; font-weight: bold; color: #00e676; margin: 5px 0; }
        .btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-purple { background: #6200ea; }
        .btn-green { background: #00c853; }
        .btn-orange { background: #ff6d00; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: #00e676; box-sizing: border-box; text-align: center; font-size: 13px; font-weight: bold; }
        input[type="number"] { color: white; font-weight: normal; }
        .limit-badge { background: #263238; color: #ffd54f; padding: 6px 12px; border-radius: 20px; font-size: 13px; display: inline-block; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 Eranbd</h2>
        <p id="uName">স্বাগতম!</p>
    </div>

    <div class="box">
        <div>আপনার বর্তমান ব্যালেন্স</div>
        <div class="bal">৳ <span id="bal">5.00</span></div>
        <div class="limit-badge">আজকের অ্যাড: <span id="todayCount">0</span> / 15 টি</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;">সর্বমোট দেখা অ্যাড: <span id="adCount">0</span> টি</div>
    </div>

    <div class="box">
        <h3>📺 বিজ্ঞাপন দেখে আয় করুন</h3>
        <button class="btn" id="ad1" onclick="watchRealAd(1, 0.20, 'default')">ভিডিও অ্যাড দেখুন (+৳০.২০)</button>
        <button class="btn btn-purple" id="ad2" onclick="watchRealAd(2, 0.20, 'pop')">পপআপ অ্যাড দেখুন (+৳০.২০)</button>
    </div>

    <div class="box">
        <h3>🤝 বন্ধুদের রেফার করুন</h3>
        <p style="font-size: 13px; color: #ccc; margin: 5px 0;">আপনার লিংক থেকে বন্ধুরা জয়েন করলে তারা পাবে ৳১০ বোনাস এবং আপনি পাবেন রেফারেল কমিশন!</p>
        <input type="text" id="refLink" readonly>
        <button class="btn btn-orange" onclick="shareNow()">📤 টেলিগ্রামে শেয়ার করুন</button>
        <button class="btn" style="background: #37474f;" onclick="copyRef()">📋 রেফার লিংক কপি করুন</button>
    </div>

    <div class="box">
        <h3>💸 টাকা তুলুন (সর্বনিম্ন ৳৫০)</h3>
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="num" placeholder="বিকাশ বা নগদ নাম্বার">
        <input type="number" id="amt" placeholder="টাকার পরিমাণ">
        <button class="btn btn-green" id="wBtn" onclick="withdraw()">টাকা তুলুন</button>
    </div>

    <script>
        var BOT_TOKEN = "9205842159:AAEFITr380n7nqB4EVKg-kS_UEYIe0grOtw";
        var ADMIN_CHAT_ID = "7213453684";
        var DAILY_LIMIT = 15;
        var userName = "User";
        var userId = "7213453684";
        var domain = "t." + "me";
        var botUser = "Eranbd_official_bot";
        var myLink = "https://" + domain + "/" + botUser + "?start=" + userId;

        document.getElementById("refLink").value = myLink;

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                var tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userName = tg.initDataUnsafe.user.first_name;
                    userId = tg.initDataUnsafe.user.id;
                    document.getElementById("uName").innerText = "স্বাগতম, " + userName + "!";
                    myLink = "https://" + domain + "/" + botUser + "?start=" + userId;
                    document.getElementById("refLink").value = myLink;
                }
            }
        };

        var todayStr = new Date().toDateString();
        var savedDate = localStorage.getItem("eb_date");
        var todayCount = parseInt(localStorage.getItem("eb_today_count")) || 0;

        if (savedDate !== todayStr) {
            todayCount = 0;
            localStorage.setItem("eb_date", todayStr);
            localStorage.setItem("eb_today_count", 0);
        }

        var bal = parseFloat(localStorage.getItem("eb_bal")) || 5.00;
        var count = parseInt(localStorage.getItem("eb_count")) || 0;
        updateStats();

        function updateStats() {
            document.getElementById("bal").innerText = bal.toFixed(2);
            document.getElementById("adCount").innerText = count;
            document.getElementById("todayCount").innerText = todayCount;
            if (todayCount >= DAILY_LIMIT) {
                document.getElementById("ad1").disabled = true;
                document.getElementById("ad2").disabled = true;
                document.getElementById("ad1").innerText = "আজকের ১৫টি লিমিট শেষ!";
                document.getElementById("ad2").innerText = "আগামীকাল আবার আসুন";
            }
        }

        function shareNow() {
            var shareText = "ঘরে বসে বিজ্ঞাপন দেখে প্রতিদিন টাকা আয় করুন! জয়েন করলেই ৳১০ বোনাস:";
            var shareUrl = "https://" + domain + "/share/url?url=" + encodeURIComponent(myLink) + "&text=" + encodeURIComponent(shareText);
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, "_blank");
            }
        }

        function copyRef() {
            var copyText = document.getElementById("refLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("রেফার লিংক কপি হয়েছে: " + copyText.value);
        }

        function startCooldown() {
            if (todayCount >= DAILY_LIMIT) return;
            var b1 = document.getElementById("ad1");
            var b2 = document.getElementById("ad2");
            b1.disabled = true;
            b2.disabled = true;
            var sec = 15;
            var timer = setInterval(function() {
                sec--;
                b1.innerText = "পরবর্তী অ্যাড (" + sec + " সেকেন্ড)";
                b2.innerText = "অপেক্ষা করুন (" + sec + " সেকেন্ড)";
                if (sec <= 0) {
                    clearInterval(timer);
                    b1.disabled = false;
                    b2.disabled = false;
                    b1.innerText = "ভিডিও অ্যাড দেখুন (+৳০.২০)";
                    b2.innerText = "পপআপ অ্যাড দেখুন (+৳০.২০)";
                }
            }, 1000);
        }

        function watchRealAd(btnId, reward, adType) {
            if (todayCount >= DAILY_LIMIT) {
                return alert("আপনার আজকের ১৫টি বিজ্ঞাপন দেখার লিমিট শেষ হয়েছে! আগামীকাল আবার দেখতে পারবেন।");
            }

            var btn = document.getElementById("ad" + btnId);
            var oldText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            if (typeof show_12280121 !== "function") {
                btn.disabled = false;
                btn.innerText = oldText;
                return alert("বিজ্ঞাপন সার্ভার লোড হচ্ছে, ৫ সেকেন্ড পর আবার চাপ দিন।");
            }

            var adCall = (adType === "pop") ? show_12280121("pop") : show_12280121();
            adCall.then(function() {
                bal += reward;
                count += 1;
                todayCount += 1;
                localStorage.setItem("eb_bal", bal);
                localStorage.setItem("eb_count", count);
                localStorage.setItem("eb_today_count", todayCount);
                localStorage.setItem("eb_date", todayStr);
                updateStats();
                alert("অভিনন্দন! ৳" + reward.toFixed(2) + " যোগ হয়েছে। (আজকে: " + todayCount + "/15)");
                startCooldown();
            }).catch(function() {
                btn.disabled = false;
                btn.innerText = oldText;
                alert("এই মুহূর্তে বিজ্ঞাপন নেই, কিছুক্ষণ পর আবার চেষ্টা করুন।");
            });
        }

        function withdraw() {
            var method = document.getElementById("method").value;
            var num = document.getElementById("num").value;
            var amt = parseFloat(document.getElementById("amt").value);
            if (num.length < 11 || isNaN(amt) || amt < 50 || amt > bal) {
                return alert("সঠিক নাম্বার ও পর্যাপ্ত ব্যালেন্স দিন!");
            }
            var msg = "নতুন পেমেন্ট রিকোয়েস্ট (Eranbd)\nইউজার: " + userName + " (" + userId + ")\nমাধ্যম: " + method + "\nনাম্বার: " + num + "\nটাকা: ৳" + amt;
            var apiHost = "api.telegram" + ".org";
            var url = "https://" + apiHost + "/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + ADMIN_CHAT_ID + "&text=" + encodeURIComponent(msg);
            fetch(url).then(function(r) { return r.json(); }).then(function(d) {
                if (d.ok) {
                    bal -= amt;
