<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eranbd - অ্যাড দেখে ইনকাম</title>
    <script src="https://telegram.org"></script>
    <script src="https://libtl.com" data-zone="12280121" data-sdk="show_12280121"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { background: linear-gradient(135deg, #0088cc, #005580); padding: 20px; border-radius: 15px; margin-bottom: 15px; }
        .header h2 { margin: 0; font-size: 24px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .bal { font-size: 32px; font-weight: bold; color: #00e676; margin: 5px 0; }
        .btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn:disabled { background: #555; }
        .btn-purple { background: #6200ea; }
        .btn-green { background: #00c853; }
        .btn-orange { background: #ff6d00; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: #00e676; box-sizing: border-box; text-align: center; font-size: 13px; font-weight: bold; }
        input[type="number"] { color: white; font-weight: normal; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 Eranbd</h2>
        <p id="uName">স্বাগতম!</p>
    </div>

    <div class="box">
        <div>আপনার বর্তমান ব্যালেন্স</div>
        <div class="bal">৳ <span id="bal">5.00</span></div>
        <div style="font-size: 13px; color: #aaa;">মোট দেখা অ্যাড: <span id="adCount">0</span> টি</div>
    </div>

    <div class="box">
        <h3>📺 বিজ্ঞাপন দেখে আয় করুন</h3>
        <button class="btn" id="ad1" onclick="watchRealAd(1, 1.00, 'default')">ভিডিও অ্যাড দেখুন (+৳১.০০)</button>
        <button class="btn btn-purple" id="ad2" onclick="watchRealAd(2, 0.50, 'pop')">পপআপ অ্যাড দেখুন (+৳০.৫০)</button>
    </div>

    <div class="box">
        <h3>🤝 বন্ধুদের রেফার করুন</h3>
        <p style="font-size: 13px; color: #ccc; margin: 5px 0;">আপনার লিংক থেকে বন্ধুরা জয়েন করলে তারা পাবে ৳১০ বোনাস এবং আপনি পাবেন রেফারেল কমিশন!</p>
        <input type="text" id="refLink" value="t.me/Eranbd_official_bot" readonly>
        <button class="btn btn-orange" onclick="shareRef()">📤 টেলিগ্রামে শেয়ার করুন</button>
        <button class="btn" style="background: #37474f;" onclick="copyRef()">📋 রেফার লিংক কপি করুন</button>
    </div>

    <div class="box">
        <h3>💸 টাকা তুলুন (সর্বনিম্ন ৳৫০)</h3>
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="num" placeholder="বিকাশ বা নগদ নাম্বার">
        <input type="number" id="amt" placeholder="টাকার পরিমাণ">
        <button class="btn btn-green" id="wBtn" onclick="withdraw()">টাকা তুলুন</button>
    </div>

    <script>
        var tg = window.Telegram.WebApp;
        tg.expand();

        var BOT_TOKEN = "9205842159:AAEFITr380n7nqB4EVKg-kS_UEYIe0grOtw";
        var ADMIN_CHAT_ID = "7213453684";
        var userName = "User";
        var userId = "7213453684";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
            userId = tg.initDataUnsafe.user.id;
            document.getElementById("uName").innerText = "স্বাগতম, " + userName + "!";
        }

        var fullBotLink = "https:" + String.fromCharCode(47, 47) + "t.me/Eranbd_official_bot?start=" + userId;
        document.getElementById("refLink").value = fullBotLink;

        var bal = parseFloat(localStorage.getItem("eb_bal")) || 5.00;
        var count = parseInt(localStorage.getItem("eb_count")) || 0;
        document.getElementById("bal").innerText = bal.toFixed(2);
        document.getElementById("adCount").innerText = count;

        function copyRef() {
            var copyText = document.getElementById("refLink");
            copyText.select();
            document.execCommand("copy");
            alert("রেফার লিংক কপি হয়েছে: " + copyText.value);
        }

        function shareRef() {
            var text = "ঘরে বসে বিজ্ঞাপন দেখে প্রতিদিন টাকা আয় করুন! জয়েন করলেই ৳১০ বোনাস:";
            var shareBase = "https:" + String.fromCharCode(47, 47) + "t.me/share/url";
            tg.openTelegramLink(shareBase + "?url=" + encodeURIComponent(fullBotLink) + "&text=" + encodeURIComponent(text));
        }

        function watchRealAd(btnId, reward, adType) {
            var btn = document.getElementById("ad" + btnId);
            var oldText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            var adCall = (adType === "pop") ? show_12280121("pop") : show_12280121();
            adCall.then(function() {
                bal += reward;
                count += 1;
                localStorage.setItem("eb_bal", bal);
                localStorage.setItem("eb_count", count);
                document.getElementById("bal").innerText = bal.toFixed(2);
                document.getElementById("adCount").innerText = count;
                btn.disabled = false;
                btn.innerText = oldText;
                alert("অভিনন্দন! ৳" + reward.toFixed(2) + " যোগ হয়েছে।");
            }).catch(function() {
                btn.disabled = false;
                btn.innerText = oldText;
                alert("বিজ্ঞাপন লোড হয়নি, আবার চেষ্টা করুন।");
            });
        }

        function withdraw() {
            var method = document.getElementById("method").value;
            var num = document.getElementById("num").value;
            var amt = parseFloat(document.getElementById("amt").value);
            if (num.length < 11 || isNaN(amt) || amt < 50 || amt > bal) {
                return alert("সঠিক নাম্বার ও পর্যাপ্ত ব্যালেন্স দিন!");
            }
            var msg = "নতুন পেমেন্ট রিকোয়েস্ট (Eranbd)\nইউজার: " + userName + " (" + userId + ")\nমাধ্যম: " + method + "\nনাম্বার: " + num + "\nটাকা: ৳" + amt;
            var apiBase = "https:" + String.fromCharCode(47, 47) + "api.telegram.org/bot";
            var url = apiBase + BOT_TOKEN + "/sendMessage?chat_id=" + ADMIN_CHAT_ID + "&text=" + encodeURIComponent(msg);
            fetch(url).then(function(r) { return r.json(); }).then(function(d) {
                if (d.ok) {
                    bal -= amt;
                    localStorage.setItem("eb_bal", bal);
                    document.getElementById("bal").innerText = bal.toFixed(2);
                    alert("রিকোয়েস্ট সফল হয়েছে!");
                }
            });
        }
    </script>
</body>
</html>
