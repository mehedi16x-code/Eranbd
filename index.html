<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eranbd - অ্যাড দেখে ইনকাম</title>
    <script src="https://telegram.org"></script>
    <script src="https://libtl.com" data-zone="12280121" data-sdk="show_12280121"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .header { background: linear-gradient(135deg, #0088cc, #005580); padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,136,204,0.3); }
        .header h2 { margin: 0; font-size: 24px; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .bal { font-size: 32px; font-weight: bold; color: #00e676; margin: 5px 0; }
        .btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-purple { background: #6200ea; }
        .btn-green { background: #00c853; }
        .btn-orange { background: #ff6d00; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; text-align: center; font-size: 13px; }
        .ref-badge { background: #263238; color: #80cbc4; padding: 6px; border-radius: 6px; font-size: 12px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚀 Eranbd</h2>
        <p id="uName">স্বাগতম!</p>
        <div id="refInfo" class="ref-badge"></div>
    </div>

    <div class="box">
        <div>আপনার বর্তমান ব্যালেন্স</div>
        <div class="bal">৳ <span id="bal">5.00</span></div>
        <div style="font-size: 13px; color: #aaa;">মোট দেখা অ্যাড: <span id="adCount">0</span> টি</div>
    </div>

    <div class="box">
        <h3>📺 বিজ্ঞাপন দেখে আয় করুন</h3>
        <button class="btn" id="ad1" onclick="watchRealAd(1, 1.00, 'default')">ভিডিও অ্যাড দেখুন (+৳১.০০)</button>
        <button class="btn btn-purple" id="ad2" onclick="watchRealAd(2, 0.50, 'pop')">পপআপ অ্যাড দেখুন (+৳০.৫০)</button>
    </div>

    <div class="box">
        <h3>🤝 বন্ধুদের রেফার করুন</h3>
        <p style="font-size: 13px; color: #ccc; margin: 5px 0;">আপনার লিংক থেকে বন্ধুরা জয়েন করলে তারা পাবে ৳১০ বোনাস এবং আপনি পাবেন রেফারেল কমিশন!</p>
        <input type="text" id="refLink" readonly>
        <button class="btn btn-orange" onclick="shareRef()">📤 টেলিগ্রামে শেয়ার করুন</button>
        <button class="btn" style="background: #37474f;" onclick="copyRef()">📋 রেফার লিংক কপি করুন</button>
    </div>

    <div class="box">
        <h3>💸 টাকা তুলুন (সর্বনিম্ন ৳৫০)</h3>
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="num" placeholder="বিকাশ বা নগদ নাম্বার">
        <input type="number" id="amt" placeholder="টাকার পরিমাণ">
        <button class="btn btn-green" id="wBtn" onclick="withdraw()">টাকা তুলুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand();

        const BOT_TOKEN = "9205842159:AAEFITr380n7nqB4EVKg-kS_UEYIe0grOtw"; 
        const ADMIN_CHAT_ID = "7213453684";

        let userName = "Unknown User";
        let userId = "7213453684";
        let referredBy = localStorage.getItem('eb_ref_by') || "Direct";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            userName = u.first_name + (u.last_name ? " " + u.last_name : "");
            userId = u.id;
            document.getElementById('uName').innerText = "স্বাগতম, " + u.first_name + "!";
        }

        // এমনভাবে লিংক তৈরি করা হলো যাতে কোনোভাবেই ভেঙে না যায়
        const myRefLink = ["https:", "", "mehedi16x-code.github.io", "Eranbd", "?start=" + userId].join("/");
        document.getElementById('refLink').value = myRefLink;

        let isFirstTime = !localStorage.getItem('eb_joined');
        let startParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('start');
        
        let initialBonus = 5.00;
        if (isFirstTime) {
            if (startParam && startParam != userId) {
                referredBy = startParam;
                localStorage.setItem('eb_ref_by', referredBy);
                initialBonus = 10.00;
                alert("🎉 রেফারেল লিংকে জয়েন করার জন্য আপনি ৳১০.০০ বোনাস পেয়েছেন!");
            }
            localStorage.setItem('eb_joined', 'true');
            localStorage.setItem('eb_bal', initialBonus);
        }

        if (referredBy !== "Direct") {
            const refBadge = document.getElementById('refInfo');
            refBadge.style.display = "block";
            refBadge.innerText = "রেফারার আইডি: " + referredBy;
        }

        let bal = parseFloat(localStorage.getItem('eb_bal')) || initialBonus;
        let count = parseInt(localStorage.getItem('eb_count')) || 0;
        updateUI();

        function updateUI() {
            document.getElementById('bal').innerText = bal.toFixed(2);
            document.getElementById('adCount').innerText = count;
            localStorage.setItem('eb_bal', bal);
            localStorage.setItem('eb_count', count);
        }

        function copyRef() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("✅ Eranbd রেফার লিংক কপি হয়েছে:\n" + copyText.value);
        }

        function shareRef() {
            const shareText = "🚀 ঘরে বসে মোবাইল দিয়ে বিজ্ঞাপন দেখে প্রতিদিন টাকা আয় করুন! আমার Eranbd লিংক থেকে জয়েন করলেই পাবেন ৳১০ বোনাস:";
            const shareBase = ["https:", "", "t.me", "share", "url"].join("/");
            const shareUrl = shareBase + "?url=" + encodeURIComponent(myRefLink) + "&text=" + encodeURIComponent(shareText);
            tg.openTelegramLink(shareUrl);
        }

        function watchRealAd(btnId, reward, adType) {
            let btn = document.getElementById('ad' + btnId);
            let oldText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            let adPromise = (adType === 'pop') ? show_12280121('pop') : show_12280121();

            adPromise.then(() => {
                bal += reward;
                count += 1;
                updateUI();
                btn.disabled = false;
                btn.innerText = oldText;
                alert("অভিনন্দন! বিজ্ঞাপন দেখার জন্য ৳" + reward.toFixed(2) + " যোগ হয়েছে।");
            }).catch((e) => {
                btn.disabled = false;
                btn.innerText = oldText;
                alert("এই মুহূর্তে বিজ্ঞাপন পাওয়া যায়নি, কয়েক সেকেন্ড পর আবার চেষ্টা করুন।");
            });
        }

        function withdraw() {
            let method = document.getElementById('method').value;
            let num = document.getElementById('num').value;
            let amt = parseFloat(document.getElementById('amt').value);
            let wBtn = document.getElementById('wBtn');

            if (num.length < 11 || isNaN(amt) || amt < 50 || amt > bal) {
                return alert("সঠিক ১১ ডিজিটের নাম্বার ও পর্যাপ্ত ব্যালেন্স দিন!");
            }

            wBtn.disabled = true;
            wBtn.innerText = "রিকোয়েস্ট পাঠানো হচ্ছে...";

            let message = `🔔 নতুন পেমেন্ট রিকোয়েস্ট (Eranbd)\n\n` +
                          `👤 ইউজার: ${userName} (ID: ${userId})\n` +
                          `🤝 রেফারার ID: ${referredBy}\n` +
                          `💳 মাধ্যম: ${method}\n` +
                          `📱 নাম্বার: ${num}\n` +
                          `💰 পরিমাণ: ৳${amt}`;

            let apiBase = ["https:", "", "api.telegram.org", "bot" + BOT_TOKEN, "sendMessage"].join("/");
            let url = `${apiBase}?chat_id=${ADMIN_CHAT_ID}&text=${encodeURIComponent(message)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    wBtn.disabled = false;
                    wBtn.innerText = "টাকা তুলুন";
                    if (data.ok) {
                        bal -= amt;
                        updateUI();
                        document.getElementById('num').value = "";
                        document.getElementById('amt').value = "";
                        alert(`সফল হয়েছে! ${method} (${num}) নাম্বারে ৳${amt} পাঠানোর রিকোয়েস্ট অ্যাডমিনের কাছে পৌঁছে গেছে।`);
                    } else {
                        alert("রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে! অ্যাডমিন সেটিংস চেক করুন।");
                    }
                })
                .catch(error => {
                    wBtn.disabled = false;
                    wBtn.innerText = "টাকা তুলুন";
                    alert("ইন্টারনেট সংযোগে সমস্যা হচ্ছে, আবার চেষ্টা করুন।");
                });
        }
    </script>
</body>
</html>
